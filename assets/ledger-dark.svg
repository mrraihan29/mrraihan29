<svg xmlns="http://www.w3.org/2000/svg" width="900" height="196" viewBox="0 0 900 196" role="img" aria-label="Live GitHub repository ledger">
  <title>Live GitHub repository ledger</title>
  <style>
    .serif { font-family: 'Newsreader', 'Spectral', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .kanji { font-family: 'Naobi Mincho', 'Yu Mincho', 'Hiragino Mincho ProN', 'Noto Serif JP', Georgia, serif; }
    .ink-breathe { animation: inkBreathe 6s ease-in-out infinite; }
    @keyframes inkBreathe {
      0%, 100% { opacity: 0.94; }
      50% { opacity: 0.78; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ink-breathe { animation: none; opacity: 0.92; }
    }
  </style>
  <rect width="900" height="196" rx="4" fill="#16130F" stroke="#3A342C" stroke-width="1"/>
  <text x="48" y="42" class="serif" font-size="22" font-weight="500" fill="#F1EEE6">Repository ledger</text>
  <text x="852" y="42" text-anchor="end" class="mono" font-size="11" fill="#9A9083">Synced 2026-11-15 15:59 WIB</text>
  <line x1="48" y1="58" x2="852" y2="58" stroke="#3A342C" stroke-width="1"/>
  <text x="48" y="79" class="sans" font-size="13" font-weight="500" fill="#C9C2B5">Languages across non-fork repositories</text>
  <clipPath id="bar-clip"><rect x="48" y="92" width="360" height="8" rx="2"/></clipPath>
  <g clip-path="url(#bar-clip)">
  <rect x="48.0" y="92" width="136.6" height="8" fill="#E3BDA9"/>
  <rect x="184.6" y="92" width="82.8" height="8" fill="#C9A464"/>
  <rect x="267.3" y="92" width="82.8" height="8" fill="#9FAA86"/>
  <rect x="350.1" y="92" width="29.0" height="8" fill="#E0675B"/>
  <rect x="379.0" y="92" width="29.0" height="8" fill="#8AB0C9"/>
  </g>
  <rect x="48" y="116" width="8" height="8" rx="1" fill="#E3BDA9"/>
  <text x="62" y="124" class="mono" font-size="11.5" fill="#C9C2B5">Python (33%)</text>
  <rect x="236" y="116" width="8" height="8" rx="1" fill="#C9A464"/>
  <text x="250" y="124" class="mono" font-size="11.5" fill="#C9C2B5">Jupyter (20%)</text>
  <rect x="48" y="137" width="8" height="8" rx="1" fill="#9FAA86"/>
  <text x="62" y="145" class="mono" font-size="11.5" fill="#C9C2B5">CSS (20%)</text>
  <rect x="236" y="137" width="8" height="8" rx="1" fill="#E0675B"/>
  <text x="250" y="145" class="mono" font-size="11.5" fill="#C9C2B5">Rust (7%)</text>
  <rect x="48" y="158" width="8" height="8" rx="1" fill="#8AB0C9"/>
  <text x="62" y="166" class="mono" font-size="11.5" fill="#C9C2B5">TypeScript (7%)</text>
  <line x1="444" y1="74" x2="444" y2="168" stroke="#3A342C" stroke-width="1"/>
  <text x="466" y="88" class="sans" font-size="12.5" fill="#9A9083">Public repositories</text>
  <text x="466" y="122" class="serif" font-size="32" font-weight="500" fill="#F1EEE6">17</text>
  <text x="466" y="152" class="sans" font-size="12" fill="#9A9083">4 stars, 2 followers</text>
  <line x1="620" y1="74" x2="620" y2="168" stroke="#3A342C" stroke-width="1"/>
  <text x="642" y="88" class="sans" font-size="12.5" fill="#9A9083">Latest repository activity</text>
  <text x="642" y="120" class="mono" font-size="15.5" font-weight="600" fill="#E3BDA9">SembadaTani</text>
  <text x="642" y="144" class="sans" font-size="12.5" fill="#C9C2B5">Push on 2026-11-14</text>
  <text x="642" y="164" class="sans" font-size="11.5" fill="#9A9083">Updated daily via GitHub Actions</text>
</svg>