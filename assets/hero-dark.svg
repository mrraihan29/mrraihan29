<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Raihan (mrraihan29) - NAOBI Engineering Blueprint">
  <title>Raihan (mrraihan29) - NAOBI Engineering Blueprint</title>
  <style>
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spin { animation: spin 24s linear infinite; transform-box: fill-box; transform-origin: center; }
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.35); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes sweep {
      0% { stroke-dashoffset: 320; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -320; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .spin, .sweep { animation: none; }
    }
  </style>
  <defs>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
