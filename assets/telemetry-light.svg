<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Live GitHub Telemetry HUD">
  <title>Live GitHub Telemetry HUD</title>
  <style>
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spin { animation: spin 24s linear infinite; transform-box: fill-box; transform-origin: center; }
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.35); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes sweep {
      0% { stroke-dashoffset: 320; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -320; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .spin, .sweep { animation: none; }
    }
  </style>
  <defs>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E7E2D6" stroke-width="1"/>
    </pattern>
    <linearGradient id="oxide-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#914A3B"/>
      <stop offset="100%" stop-color="#9C794B"/>
    </linearGradient>
    <linearGradient id="curve-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#914A3B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#914A3B" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="210" rx="16" fill="#F3F0E8" stroke="#D8D2C5" stroke-width="1.2"/>
  <text x="42" y="36" class="mono" font-size="11" fill="#7A7368" letter-spacing="1.6">SPEC 02 // LIVE REPOSITORY TELEMETRY (AUTO-SYNCED)</text>
  <text x="858" y="36" text-anchor="end" class="mono" font-size="10.5" fill="#7A7368">SYNC: 2026-11-15 15:42 WIB</text>
  <text x="42" y="74" class="sans" font-size="15" font-weight="700" fill="#171714">Primary Stack Footprint</text>
  <clipPath id="bar-clip"><rect x="42" y="92" width="340" height="12" rx="6"/></clipPath>
  <g clip-path="url(#bar-clip)">
  <rect x="42.0" y="92" width="133.0" height="12" fill="#3E6B89"/>
  <rect x="175.0" y="92" width="77.6" height="12" fill="#914A3B"/>
  <rect x="252.7" y="92" width="77.6" height="12" fill="#684737"/>
  <rect x="330.3" y="92" width="25.9" height="12" fill="#9C794B"/>
  <rect x="356.1" y="92" width="25.9" height="12" fill="#4B7447"/>
  </g>
  <circle cx="46" cy="124" r="4" fill="#3E6B89"/>
  <text x="58" y="128" class="mono" font-size="11.5" fill="#4B4740">Python (36%)</text>
  <circle cx="232" cy="124" r="4" fill="#914A3B"/>
  <text x="244" y="128" class="mono" font-size="11.5" fill="#4B4740">Jupyter (21%)</text>
  <circle cx="46" cy="146" r="4" fill="#684737"/>
  <text x="58" y="150" class="mono" font-size="11.5" fill="#4B4740">CSS (21%)</text>
  <circle cx="232" cy="146" r="4" fill="#9C794B"/>
  <text x="244" y="150" class="mono" font-size="11.5" fill="#4B4740">TypeScript (7%)</text>
  <circle cx="46" cy="168" r="4" fill="#4B7447"/>
  <text x="58" y="172" class="mono" font-size="11.5" fill="#4B4740">Svelte (7%)</text>
  <line x1="420" y1="56" x2="420" y2="184" stroke="#D8D2C5" stroke-width="1"/>
  <rect x="444" y="60" width="184" height="58" rx="10" fill="#FAF8F3" stroke="#D8D2C5"/>
  <text x="460" y="81" class="mono" font-size="10.5" fill="#7A7368">PUBLIC REPOS</text>
  <text x="460" y="106" class="mono" font-size="22" font-weight="700" fill="#171714">16</text>
  <rect x="444" y="128" width="184" height="58" rx="10" fill="#FAF8F3" stroke="#D8D2C5"/>
  <text x="460" y="149" class="mono" font-size="10.5" fill="#7A7368">STARS · FOLLOWERS</text>
  <text x="460" y="174" class="mono" font-size="18" font-weight="700" fill="#684737">1 stars · 2</text>
  <rect x="646" y="60" width="212" height="126" rx="10" fill="#FAF8F3" stroke="#D8D2C5"/>
  <circle cx="664" cy="82" r="4" fill="#4B7447" class="pulse"/>
  <text x="676" y="86" class="mono" font-size="10.5" fill="#4B7447">LATEST SIGNAL</text>
  <text x="662" y="118" class="mono" font-size="13.5" font-weight="700" fill="#171714">SembadaTani</text>
  <text x="662" y="142" class="mono" font-size="11.5" fill="#4B4740">event // Push</text>
  <text x="662" y="166" class="mono" font-size="11" fill="#7A7368">date  // 2026-11-14</text>
</svg>