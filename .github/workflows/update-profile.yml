name: Update Profile Telemetry

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render profile SVG telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile.py
      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile telemetry [skip ci]"
            git push
          fi
